[package]
name = "anchorkit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]
libfuzzer-sys = "0.4"
anchorkit = { path = "..", features = ["std", "mock-only"] }
serde_json = "1"
toml = "0.7"

[[bin]]
name = "fuzz_target_json_response_parsing"
path = "fuzz_targets/json_response_parsing.rs"
test = false
doc = false

[[bin]]
name = "fuzz_target_config_parsing"
path = "fuzz_targets/config_parsing.rs"
test = false
doc = false

[[bin]]
name = "fuzz_target_jwt_parsing"
path = "fuzz_targets/jwt_parsing.rs"
test = false
doc = false

[[bin]]
name = "fuzz_target_domain_validation"
path = "fuzz_targets/domain_validation.rs"
test = false
doc = false
