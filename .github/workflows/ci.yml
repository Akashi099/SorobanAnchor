name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: >
          Run live testnet smoke tests.
          Requires ANCHOR_CONTRACT_ID and ANCHOR_ADMIN_SECRET secrets to be configured
          in the repository Settings → Secrets → Actions.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  CARGO_TERM_COLOR: always
  WASM_TARGET: wasm32-unknown-unknown
  WASM_OUT: target/wasm32-unknown-unknown/release/anchorkit.wasm

jobs:
  # ── Core CI ────────────────────────────────────────────────────────────────
  ci:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check (native)
        run: cargo check

      - name: no_std compliance check (WASM)
        run: cargo check --target ${{ env.WASM_TARGET }} --no-default-features --features wasm

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo test (unit + integration)
        run: cargo test

      - name: cargo build WASM
        run: cargo build --release --target ${{ env.WASM_TARGET }} --no-default-features --features wasm

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen

      - name: wasm-opt and report size
        run: |
          WASM_IN="${{ env.WASM_OUT }}"
          WASM_OPT="${{ env.WASM_OUT }}.opt.wasm"
          echo "=== Raw WASM size ==="
          ls -lh "$WASM_IN"
          wasm-opt -Oz --strip-debug "$WASM_IN" -o "$WASM_OPT"
          echo "=== Optimized WASM size ==="
          ls -lh "$WASM_OPT"

  # ── CLI Integration Test Harness ───────────────────────────────────────────
  integration:
    name: CLI Integration Harness
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run CLI integration test harness (local simulation)
        run: cargo test --test cli_integration_harness -- --nocapture

      - name: Run extended integration pipeline tests (local simulation)
        run: cargo test --test integration_pipeline_tests -- --nocapture

  # ── Stress Test Suite ──────────────────────────────────────────────────────
  stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stress-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run stress-test suite
        run: cargo test --features stress-tests -- --nocapture

  # ── Performance Benchmarks ─────────────────────────────────────────────────
  #
  # Benchmarks run on every push to main to track performance over time.
  # Results are uploaded as artifacts so regressions can be spotted by
  # comparing the current run against a saved baseline.
  # This job does NOT run on pull requests to avoid inflating PR build times.
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run benchmarks and save baseline
        run: |
          cargo bench --bench load_benchmarks -- --save-baseline ci
          echo "Benchmark results saved to target/criterion/"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 90

  # ── Live Testnet Smoke Tests (opt-in via workflow_dispatch) ────────────────
  #
  # This job ONLY runs when triggered manually via workflow_dispatch with
  # run_live_tests set to 'true'.  It is NEVER triggered by push or
  # pull_request events, ensuring live tests never block regular CI.
  #
  # Required secrets (configure in Settings → Secrets → Actions):
  #   ANCHOR_CONTRACT_ID   — Contract ID of the deployed AnchorKit testnet contract
  #   ANCHOR_ADMIN_SECRET  — Admin signing key for the testnet contract
  #   STELLAR_RPC_URL      — (optional) Override for the RPC endpoint
  #
  # How to run:
  #   1. Go to Actions → CI → Run workflow
  #   2. Set run_live_tests to 'true'
  #   3. Click "Run workflow"
  live-smoke:
    name: Live Testnet Smoke Tests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_live_tests == 'true'
    needs: ci

    environment:
      name: testnet-smoke
      url: https://stellar.expert/explorer/testnet

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --features opt 2>/dev/null || true
          stellar --version || echo "WARNING: Stellar CLI not installed, live tests will skip"

      - name: Verify environment prerequisites
        run: |
          echo "Checking required environment variables..."
          if [ -z "$ANCHOR_CONTRACT_ID" ]; then
            echo "ERROR: ANCHOR_CONTRACT_ID secret is not set — configure it in Settings → Secrets → Actions"
            exit 1
          fi
          if [ -z "$ANCHOR_ADMIN_SECRET" ]; then
            echo "ERROR: ANCHOR_ADMIN_SECRET secret is not set — configure it in Settings → Secrets → Actions"
            exit 1
          fi
          echo "✅ All required secrets are present"
          echo "  Contract ID : $ANCHOR_CONTRACT_ID"
          echo "  RPC URL     : ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org (default)}"
        env:
          ANCHOR_CONTRACT_ID: ${{ secrets.ANCHOR_CONTRACT_ID }}
          ANCHOR_ADMIN_SECRET: ${{ secrets.ANCHOR_ADMIN_SECRET }}
          STELLAR_RPC_URL: ${{ secrets.STELLAR_RPC_URL }}

      - name: Run dedicated live smoke test suite
        run: cargo test --test live_smoke_tests -- --nocapture
        env:
          SOROBAN_ANCHOR_INTEGRATION: testnet
          ANCHOR_CONTRACT_ID: ${{ secrets.ANCHOR_CONTRACT_ID }}
          ANCHOR_ADMIN_SECRET: ${{ secrets.ANCHOR_ADMIN_SECRET }}
          STELLAR_RPC_URL: ${{ secrets.STELLAR_RPC_URL }}

      - name: Run live step in CLI integration harness
        run: cargo test --test cli_integration_harness harness_live_testnet_get_admin -- --nocapture
        env:
          SOROBAN_ANCHOR_INTEGRATION: testnet
          ANCHOR_CONTRACT_ID: ${{ secrets.ANCHOR_CONTRACT_ID }}
          ANCHOR_ADMIN_SECRET: ${{ secrets.ANCHOR_ADMIN_SECRET }}
          STELLAR_RPC_URL: ${{ secrets.STELLAR_RPC_URL }}

  # ── Release Packaging ──────────────────────────────────────────────────────
  release-package:
    name: Release Packaging
    runs-on: ubuntu-latest
    # Only run on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, integration]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen

      - name: Build release artifacts
        run: bash scripts/package_release.sh

      - name: Validate release bundle
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          bash scripts/validate_bundle.sh "dist/anchorkit-${VERSION}.tar.gz"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchorkit-release
          path: dist/
          retention-days: 30
